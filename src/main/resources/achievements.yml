# ==============================
# GamblingDex - Logros del casino
# ==============================
# Los jugadores los ven con /gdx achievements (o /gdx logros).
# Placeholders: %gamblingdex_achievements%  (desbloqueados)  %gamblingdex_achievements_total%
#
# Tipos (type):
#   rounds      -> jugar <amount> apuestas en total (todos los juegos)
#   win         -> ganar al menos <amount> fichas netas en una sola apuesta (game: opcional)
#   wager       -> apostar al menos <amount> en una sola apuesta (game: opcional)
#   multiplier  -> cobrar x<amount> o más de lo apostado en una apuesta (game: opcional)
#   game_win    -> ganar una apuesta en el juego <game>
#   games       -> jugar <amount> juegos distintos
#   event       -> lo activa el propio juego. Eventos:
#                  blackjack_natural, roulette_jackpot, slots_jackpot, mines_clear, tower_top,
#                  poker_tournament, poker_pot (bote de al menos 'amount'), daily_bonus
#
# Ids de juegos: slots, ruleta, blackjack, baccarat, crash, rueda, carrera, coinflip,
#                rasca, bingo, loteria, mines, plinko, tower, poker
#
# Recompensa: reward (fichas) y/o commands (desde consola, {player} = nombre).

enabled: true
announce: true          # avisar a todo el servidor cuando alguien desbloquea un logro

