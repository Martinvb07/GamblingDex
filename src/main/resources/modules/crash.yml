# ======================
# GamblingDex - Crash
# ======================
# Admin: /gdx station set crash      -> crear una mesa (mirando cualquier bloque)
#        /gdx station remove         -> quitarla (mirando el bloque)
# Jugadores: click derecho a la mesa          -> poner la apuesta
#            shift + click derecho a la mesa  -> retirarse (cobrar)
#            Sobre la barra de experiencia ves tu apuesta, el multiplicador y lo que cobras.
#            /gdx crash retirar               -> también retira
#
# Un multiplicador sube desde x1.00 hasta que "explota". Si retiras antes,
# cobras apuesta x multiplicador. Si explota antes, pierdes la apuesta.
# Con house_edge 4% la casa gana el 4% de lo apostado a la larga.

enabled: true

min_bet: 10
max_bet: 100000           # 0 = sin tope
max_win: 5000000          # premio máximo por jugador y ronda (0 = sin tope)
house_edge_percent: 4.0
max_multiplier: 1000.0
bet_window_seconds: 15    # tiempo para apostar antes de que despegue
pause_seconds: 5          # pausa tras explotar antes de la siguiente ronda
growth_per_second: 0.07   # qué tan rápido sube (0.07 = x2 a los ~10s)
auto_cashout_options: [1.5, 2.0, 3.0, 5.0, 10.0]
broadcast_win_min: 10000  # anunciar premios desde este monto (0 = nunca)
show_bar_to_everyone: false  # true = todos ven la barra del multiplicador
# true = los jugadores también pueden abrir el menú con /gdx crash (los admins siempre pueden)
allow_command: false
station_holo_height: 1.2  # altura del holograma sobre la mesa
station_bar_radius: 8     # quienes estén a esta distancia de una mesa ven la barra (0 = nadie)

messages:
  joined: "&aApostaste &e{amount}&a en Crash.{auto}"
  auto_suffix: " &7Retiro automático en &fx{auto}&7."
  not_betting: "&cAhora no se puede apostar. Espera la próxima ronda."
  already_in: "&cYa apostaste en esta ronda."
  min_bet: "&cLa apuesta mínima es &e{min}&c."
  max_bet: "&cLa apuesta máxima es &e{max}&c."
  not_enough: "&cNo te alcanzan las fichas. Tienes &e{balance}&c."
  not_in: "&cNo estás jugando esta ronda."
  cashed_out: "&a&l¡RETIRASTE! &7en &fx{mult} &7→ &e+{amount}"
  crashed_lost: "&c&l¡EXPLOTÓ en x{mult}! &7Perdiste &e{amount}&7."
  crashed_all: "&6&lCrash &8» &c&lEXPLOTÓ en x{mult}"
  round_open: "&6&lCrash &8» &7Nueva ronda: apuesta en los próximos &f{seconds}s &7(&emesa de Crash&7)"
  big_win: "&6&lCrash &8» &f{player} &7retiró en &fx{mult} &7y ganó &e{amount}&7!"
  refunded: "&7La ronda de Crash se canceló. Se te devolvieron &e{amount}&7."
  usage: "&cUso: /gdx crash [apostar <monto> [auto] | retirar]"
  use_station: "&7Crash se juega en las mesas del casino: &fclick derecho&7 a una mesa de Crash."
  station_created: "&aMesa de Crash creada. &7Click derecho al bloque para jugar."
  station_exists: "&eEse bloque ya es una mesa de Crash."
  station_removed: "&aMesa de Crash eliminada."
  cannot_break: "&cEs una mesa de Crash. Quítala con &f/gdx station remove&c."
  already_in_station: "&7Ya apostaste &e{amount}&7. Despega en &f{seconds}s&7."
  wait_next: "&7Ronda en curso. Apuesta en la próxima."
  wait_next_seconds: "&7Siguiente ronda en &f{seconds}s&7."
  already_cashed: "&7Ya retiraste en &fx{mult}&7."
  cashout_hint: "&eShift + click derecho &7a la mesa para retirar."
