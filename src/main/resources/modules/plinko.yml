# ======================
# GamblingDex - Plinko
# ======================
# Admin: mira un bloque y usa: /gdx station set plinko
#        -> estación con MENÚ: click derecho abre el Plinko en un cofre (8 filas, juegan varios a la vez).
#        /gdx station set plinko wall [rows]
#        -> pared física. Filas: 6, 8 (por defecto), 10 o 12. Detrás de la mesa se construye la pared
#        con clavos (varillas del End) sobre un fondo, y abajo las casillas con su multiplicador.
#        Tamaño: (2 x filas + 3) de ancho y de alto. 8 filas = 19 x 19, 6 filas = 15 x 15.
#        Quitarlo: /gdx station remove (mirando la mesa o el tablero); los bloques vuelven a como estaban.
# Menú: apuesta abajo, SOLTAR BOLA (shift = 5 bolas). Usa los multiplicadores de "8".
# Pared: click derecho a la mesa -> eligen la apuesta y sueltan una bola.
#            Shift + click derecho -> otra bola con la misma apuesta.
#
# En cada fila la bola rebota a la izquierda o a la derecha (50/50). Las casillas de las
# orillas son las menos probables, por eso pagan más. Con estas tablas la casa gana ~1-3%.

enabled: true

min_bet: 10
max_bet: 0                  # 0 = sin tope
max_win: 0                  # premio máximo por bola (0 = sin tope)
max_balls_per_player: 5     # bolas en el aire a la vez por jugador
title_min_multiplier: 5     # mostrar título en pantalla desde este multiplicador
ball_item: SLIME_BALL       # ítem que se ve como bola

# Estación con menú
station_holo: "&6&lPLINKO\n&7Click para jugar"
station_holo_height: 1.2

# Máquina de Plinko en 3D con ModelEngine (opcional) sobre cada estación con menú:
# cabina morada y naranja con cartel "PLINKO", tablero de 8 filas de clavos y 9 casillas.
# Cada bola que se suelta en el menú cae también en la pantalla por el MISMO camino y en la
# misma casilla (que se ilumina); con premio grande la pantalla destella. Caen hasta 3 a la vez.
# La ven y la oyen todos los que estén cerca. Se copia sola a plugins/ModelEngine/blueprints/gamblingdex:
# /meg reload y /gdx pack. Mira hacia quien puso la estación; girarla: /gdx station rotate.
# (Los colores de las casillas del modelo son los de los multiplicadores de "8" por defecto.)
model:
  enabled: true
  id: plinko_machine          # nombre del modelo en ModelEngine
  hide_station: auto          # auto | always | never (esconder el bloque y el holograma a quien ve el modelo)
  collision: true             # la máquina es sólida (no se puede atravesar)
  y_offset_hidden: 0.0        # altura de la máquina con el bloque escondido (en el suelo)
  y_offset: 1.0               # con hide_station: never, la máquina va encima del bloque
  hitbox_width: 1.0
  hitbox_height: 2.0
  sound_radius: 12            # los que estén cerca oyen la máquina

# Multiplicador de cada casilla, de izquierda a derecha (filas + 1 valores)
multipliers:
  "6": [5, 1.5, 0.8, 0.5, 0.8, 1.5, 5]
  "8": [5.6, 2.1, 1.1, 1, 0.5, 1, 1.1, 2.1, 5.6]
  "10": [8.9, 3, 1.4, 1.1, 1, 0.5, 1, 1.1, 1.4, 3, 8.9]
  "12": [10, 3, 1.6, 1.4, 1.1, 1, 0.5, 1, 1.1, 1.4, 1.6, 3, 10]

# Bloques
background_material: BLACK_CONCRETE
frame_material: POLISHED_BLACKSTONE_BRICKS
peg_material: END_ROD
slot_materials:
  high: RED_CONCRETE        # x5 o más
  medium: ORANGE_CONCRETE   # x2 a x5
  low: YELLOW_CONCRETE      # x1 a x2
  loss: LIME_CONCRETE       # menos de x1

messages:
  use_station: "&7Plinko se juega en las estaciones: &fclick derecho&7 para abrir el tablero."
  menu_station_created: "&aEstación de Plinko creada. &7Click derecho al bloque para jugar."
  menu_station_removed: "&aEstación de Plinko eliminada."
  landed: "&6&lPlinko &8» &7Cayó en &fx{mult} &8→ {result}"
  too_many: "&cEspera a que caigan tus bolas (máximo {max} a la vez)."
  not_enough: "&cNo te alcanzan las fichas. Tienes &e{balance}&c."
  bad_amount: "&cLa apuesta debe estar entre &e{min}&c y &e{max}&c."
  bad_rows: "&cFilas válidas: &f{rows}&c (según multipliers en plinko.yml)."
  exists: "&cAhí ya hay un tablero de Plinko."
  station_created: "&aTablero de Plinko construido ({rows} filas). &7Los jugadores sueltan bolas con click derecho a la mesa."
  station_removed: "&aTablero de Plinko eliminado y bloques restaurados."
  station_blocked: "&cHay un bloque en el camino en &f{x} {y} {z}&c ({block}). El tablero mide {w}x{h}: despeja detrás de la mesa."
