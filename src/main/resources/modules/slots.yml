# ======================
# GamblingDex - Tragamonedas
# ======================
# Admin: /gdx station set slots (mirando el bloque) | /gdx item slots
# Jugadores: click derecho a la estación -> menú con 3 rodillos. Eligen la apuesta
#            con los botones de abajo y pulsan GIRAR (se cobra de sus fichas).
#
# Recarga en caliente: /gdx reload

# Apuesta (se elige con los botones del menú y se cobra al girar)
min_bet: 10
max_bet: 0                  # 0 = sin tope

# Jackpot progresivo: cada tirada suma un % de la apuesta al pozo. Quien saque
# 3 del símbolo del jackpot en la línea se lleva todo el pozo (además del triple).
# Placeholder: %gamblingdex_jackpot_slots%
jackpot:
  enabled: true
  contribution_percent: 2.0   # % de cada apuesta que va al pozo
  seed: 10000                 # con cuánto vuelve a empezar el pozo después de ganarse
  symbol: NETHER_STAR         # tiene que estar en symbol_weights
  broadcast: "&6&l★ JACKPOT TRAGAMONEDAS ★ &e{player} &7se llevó &6&l{amount} &7fichas!"
  # Campana: cuando el pozo pasa de min_pot sale un aviso (y suena una campana) SOLO para
  # los que estén cerca de una estación de slots. Mientras siga alto, el aviso se repite cada
  # repeat_minutes; la campana suena como mucho max_sounds_per_day veces al día.
  bell:
    enabled: true
    min_pot: 300000           # el pozo tiene que llegar a esto para que suene
    repeat_minutes: 10        # cada cuánto se repite el AVISO mientras siga alto (0 = solo una vez)
    max_sounds_per_day: 3     # veces al día que suena la CAMPANA (0 = sin límite)
    radius: 20                # bloques alrededor de cada estación de slots
    sound: block.bell.use
    volume: 1.0
    rings: 3                  # campanadas
    message: "&6&l🔔 JACKPOT &8» &7¡El pozo de los slots ya va en &6&l{amount}&7 fichas! ¿Te lo llevas?"

payout:
  triple_multiplier: 5
  double_multiplier: 2
# Anti-spam: cooldown entre giros (0 para desactivar)
spin_cooldown_ms: 0
# Probabilidades por símbolo (peso relativo). Si lo dejas vacío/no definido, es uniforme.
# Materiales sugeridos: DIAMOND, EMERALD, GOLD_INGOT, IRON_INGOT, AMETHYST_SHARD, NETHER_STAR
symbol_weights:
  DIAMOND: 10
  EMERALD: 10
  GOLD_INGOT: 10
  IRON_INGOT: 10
  AMETHYST_SHARD: 10
  NETHER_STAR: 10
# Nombres de los símbolos en el menú (opcional). Ej.: DIAMOND: "Diamante"
symbol_names: {}

# Temas: cada estación de slots puede ser una máquina distinta con sus propios
# símbolos, pesos y pagos. Crear: mira el bloque y usa /gdx station set slots <tema>
# (sin tema = la máquina clásica de arriba). Lo que no pongas en el tema se toma de
# arriba. El jackpot progresivo es el MISMO pozo para todas las máquinas; cada tema
# elige qué símbolo lo gana (jackpot.symbol, tiene que estar en sus symbol_weights).
themes:
  nether:
    name: "&c&lSLOTS DEL NETHER"
    holo: "&c&lSLOTS DEL NETHER\n&7Click para jugar"
    title: "&8&l✦ &c&lSLOTS DEL NETHER &8&l✦"
    symbol_weights:
      NETHERITE_INGOT: 5
      BLAZE_ROD: 10
      MAGMA_CREAM: 12
      QUARTZ: 12
      GOLD_NUGGET: 12
      NETHER_STAR: 5
    symbol_names:
      NETHERITE_INGOT: "Netherita"
      BLAZE_ROD: "Vara de blaze"
      MAGMA_CREAM: "Magma"
      QUARTZ: "Cuarzo"
      GOLD_NUGGET: "Pepita"
      NETHER_STAR: "Estrella"
    payout:
      triple_multiplier: 6
      double_multiplier: 2
    jackpot:
      symbol: NETHER_STAR
  oceano:
    name: "&b&lSLOTS DEL OCÉANO"
    holo: "&b&lSLOTS DEL OCÉANO\n&7Click para jugar"
    title: "&8&l✦ &b&lSLOTS DEL OCÉANO &8&l✦"
    symbol_weights:
      HEART_OF_THE_SEA: 5
      TRIDENT: 8
      PRISMARINE_CRYSTALS: 12
      NAUTILUS_SHELL: 12
      TROPICAL_FISH: 12
      NETHER_STAR: 5
    symbol_names:
      HEART_OF_THE_SEA: "Corazón del mar"
      TRIDENT: "Tridente"
      PRISMARINE_CRYSTALS: "Prismarina"
      NAUTILUS_SHELL: "Caracola"
      TROPICAL_FISH: "Pez tropical"
      NETHER_STAR: "Estrella"
    payout:
      triple_multiplier: 5
      double_multiplier: 2
    jackpot:
      symbol: NETHER_STAR

log_big_wins:
  # Si es >0, loggea premios >= threshold_units
  threshold_units: 0

# Menú
gui:
  title: "&8&l✦ &d&lTRAGAMONEDAS &8&l✦"

# Ítem que abre los slots (/gdx item slots)
item:
  glow: true
  name: "&d&lTragamonedas"
  lore:
    - "&8────────────────────────"
    - "&7Click derecho para abrir"
    - "&7los &dTragamonedas&7."
    - "&8────────────────────────"
