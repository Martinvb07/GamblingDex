# ======================
# GamblingDex - Lotería del servidor
# ======================
# /gdx lottery                -> ver pozo, tus boletos y comprar
# /gdx lottery buy <n>    -> comprar n boletos
# Admin: /gdx lottery draw -> sortear ahora
#
# Cada boleto es una chance. Más boletos = más probabilidad de ganar.

enabled: true

ticket_price: 100
max_tickets_per_player: 1000   # 0 = sin límite
house_cut_percent: 10.0        # la casa se queda con este % de lo vendido

# Horas de sorteo (formato 24h HH:mm). Pueden ser varias.
draw_times: ["20:00"]
# Zona horaria (ej: America/Bogota, America/Mexico_City, Europe/Madrid). Vacío = la del servidor.
timezone: ""

# Mínimo de jugadores distintos para sortear
min_players: 2
# Si no se llega al mínimo: true = el pozo pasa al siguiente sorteo; false = se devuelven los boletos
rollover_if_not_enough: false

# Reparto del pozo entre ganadores (en %). Si hay menos jugadores que premios,
# los premios que sobran se suman al primero.
prizes: [70, 20, 10]

# Avisos al server (minutos antes del sorteo)
reminders_minutes: [60, 30, 10, 5, 1]

messages:
  bought: "&aCompraste &e{amount} &aboleto(s) por &e{price}&a. Tienes &f{total}&a."
  not_enough: "&cNo te alcanzan las fichas. Necesitas &e{price}&c y tienes &e{balance}&c."
  max_tickets: "&cSolo puedes tener &e{max}&c boletos por sorteo."
  reminder: "&6&lLotería &8» &7Sorteo en &f{time}&7. Pozo: &e{pot}&7. Compra con &e/gdx lottery"
  drawing: "&6&lLotería &8» &e¡Comienza el sorteo! &7Pozo: &e{pot}"
  winner: "&6&lLotería &8» &f{place}° lugar: &a&l{player} &7(&f{tickets} &7boletos) gana &e{amount}"
  you_won: "&a&l¡GANASTE LA LOTERÍA! &7{place}° lugar → &e+{amount}"
  not_enough_players: "&6&lLotería &8» &7No hubo suficientes jugadores (mínimo {min})."
  refunded: "&7Se te devolvieron &e{amount}&7 de tus boletos de lotería."
  rollover: "&6&lLotería &8» &7El pozo de &e{pot}&7 pasa al próximo sorteo."
  usage: "&cUso: /gdx lottery [buy <amount>]"
