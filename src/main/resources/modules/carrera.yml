# ======================
# GamblingDex - Carrera de caballos
# ======================
# Pista automática (recomendado):
#   Mira un bloque y usa: /gdx station set race <distance> <lanes> [name]
#   Ese bloque queda como MESA de apuestas y detrás se construye la pista en la
#   dirección en que miras: vallas entre carriles, puertas de salida y meta.
#   Necesita terreno plano y despejado. Quitarla: /gdx station remove (mirando la mesa);
#   los bloques vuelven a como estaban.
#
# Pista manual: párate en la salida del carril 1, MIRANDO HACIA LA META, y usa:
#   /gdx race create <name> [lanes] [length]
#   /gdx race remove <name> | /gdx race list | /gdx race start <name>
# Jugadores: click derecho a la mesa de la pista para apostar.
# Los mensajes de la carrera solo les llegan a los que apostaron.
#
# Cuotas (odds_mode):
#   fixed  -> cada caballo paga carriles x (1 - house_cut_percent). Ej: 6 carriles y 8% = x5.52.
#             Se puede jugar SOLO. Lo que se pierde se lo queda la casa.
#   mutual -> apuestas mutuas (hipódromo): todo forma un pozo, la casa se queda con
#             house_cut_percent y el resto se reparte entre los que acertaron.
#             Si nadie acierta se devuelve todo (necesita varios jugadores).

enabled: true

default_lanes: 6
default_length: 30
lane_spacing: 2
min_bet: 10
max_bet: 100000           # 0 = sin tope
house_cut_percent: 8.0
odds_mode: fixed          # fixed (cuota fija, se puede jugar solo) o mutual
bet_window_seconds: 40    # cuenta regresiva desde la primera apuesta
result_seconds: 10
race_speed: 1.0           # 1.0 = ~15 s para 30 bloques

# Pista automática (/gdx station set race). default_lanes/default_length de arriba
# se usan si no indicas carriles/distancia.
station:
  fence_material: OAK_FENCE
  gate_material: OAK_FENCE_GATE
  floor_material: COARSE_DIRT        # piso de los carriles ("" = no tocar el piso)
  finish_materials: [WHITE_CONCRETE, BLACK_CONCRETE]   # meta a cuadros
  holo_height: 1.2                   # holograma sobre la mesa

horse_names: ["Relámpago", "Trueno", "Canela", "Tornado", "Pegaso", "Centella", "Bala", "Sombra"]

messages:
  bet_placed: "&aApostaste &e{amount}&a al &f#{horse} {name}&a. &7Cuota actual: &fx{odds}"
  countdown: "&6&lCarrera &8» &7¡Apuestas abiertas en &f{track}&7! Sale en &f{seconds}s"
  start: "&6&lCarrera &8» &a¡Y ARRANCAN! &7Pozo: &e{pot}"
  winner: "&6&lCarrera &8» &a&l¡Ganó el #{horse} {name}! &7Paga &fx{odds}"
  you_won: "&a&l¡GANASTE! &7Tu caballo #{horse} ganó → &e+{amount}"
  you_lost: "&7Ganó el #{horse}. Perdiste &e{amount}&7."
  no_winner_bets: "&6&lCarrera &8» &7Nadie apostó al ganador: se devuelven las apuestas."
  refunded: "&7La carrera se canceló. Se te devolvieron &e{amount}&7."
  bets_closed: "&cLa carrera ya empezó. Espera la próxima."
  min_bet: "&cLa apuesta mínima es &e{min}&c."
  max_bet: "&cLa apuesta máxima es &e{max}&c."
  not_enough: "&cNo te alcanzan las fichas. Tienes &e{balance}&c."
  created: "&aPista &f{name}&a creada: &f{lanes}&a carriles de &f{length}&a bloques."
  removed: "&aPista eliminada (se devolvieron las apuestas)."
  not_found: "&cNo existe esa pista. Pistas: &f{tracks}"
  no_tracks: "&cNo hay pistas de carreras todavía."
  exists: "&cYa existe una pista con ese nombre."
  usage_admin: "&cUso: /gdx race <create|remove|list|start> [name] [lanes] [length]"
  station_usage: "&cUso: /gdx station set race <distance> <lanes> [name]"
  station_created: "&aPista &f{track}&a construida: &f{lanes}&a carriles de &f{length}&a bloques. &7Click derecho a la mesa para apostar."
  station_removed: "&aPista &f{track}&a eliminada: se devolvieron las apuestas y se restauraron los bloques."
  station_exists: "&eEse bloque ya es la mesa de la pista &f{track}&e."
  station_blocked: "&cHay un bloque en el camino en &f{x} {y} {z}&c ({block}). Despeja el área o mira hacia otro lado."
  cannot_break: "&cEs parte de la pista &f{track}&c. Quítala con &f/gdx station remove&c (mirando la mesa)."
  summary: "&6&lCarrera &8» &7Ganadores: {players}"
  use_station: "&7Para apostar, haz &fclick derecho&7 a la mesa de la pista."
