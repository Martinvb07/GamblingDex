# ======================
# GamblingDex - Ruleta física (americana, con 0 y 00)
# ======================
# Admin: /gdx roulette build [radius] [yOffset] (mirando el bloque centro)
#        /gdx roulette remove | /gdx roulette list
# Jugadores: click derecho al centro -> menú: eliges la apuesta, el monto y listo.
#            También: fichas en la mano + click derecho al centro (shift = todo el stack).
#            "Repetir apuesta" vuelve a poner lo de la ronda anterior.
#
# Recarga en caliente: /gdx reload

radius: 6
segment_y_offset: -1
auto_cycle:
  enabled: true
  interval_seconds: 45
bet_window_seconds: 40       # tiempo de apuestas abiertas
min_bet: 1                   # apuesta mínima por jugada (en fichas)
max_bet: 0                   # apuesta máxima por jugada (0 = sin límite)
# Giro: la luz da vueltas rápido unos segundos y frena de a poco hasta el ganador
spin_fast_seconds: 4         # segundos girando rápido
spin_slow_steps: 18          # cuántos números recorre mientras frena
spin_slow_max_ticks: 12      # pausa del último paso (20 ticks = 1 s); más alto = frena más
max_bets_per_player: 30      # cuántas apuestas DISTINTAS por ronda (el monto no tiene tope)
broadcast_winners: false
# Jackpot: un pozo que se llena con un % de lo que pierden los jugadores (es uno solo
# para todas las ruletas). A veces, al abrir las apuestas, la ronda es de JACKPOT en un
# número al azar (se ve en el holograma). Si sale ese número, los que le apostaron
# PLENO se reparten el pozo según cuánto puso cada uno. Si nadie le apostó, sigue creciendo.
# Placeholder para hologramas: %gamblingdex_jackpot_ruleta%
jackpot:
  enabled: true
  contribution_percent: 5    # % de lo perdido que va al pozo
  chance_percent: 15         # probabilidad de que una ronda sea de jackpot
  min_pot: 1000              # solo hay rondas de jackpot si el pozo tiene al menos esto
  seed: 0                    # con cuánto vuelve a empezar el pozo después de ganarse
  announce_radius: 20        # el aviso de "ronda de jackpot" solo les llega a los que estén a esta distancia
  broadcast_win: true        # cuando alguien se lo gana se anuncia a TODO el servidor (false = solo a los de cerca)
  # Campana: cuando el pozo pasa de min_pot suena una campana y sale un aviso, SOLO para
  # los que estén cerca de una mesa de ruleta. Mientras siga alto, se repite cada repeat_minutes.
  bell:
    enabled: true
    min_pot: 50000            # el pozo tiene que llegar a esto para que suene
    repeat_minutes: 10        # 0 = solo una vez cada vez que pasa el mínimo
    radius: 20                # bloques alrededor de cada mesa
    sound: block.bell.use
    volume: 1.0
    rings: 3                  # campanadas
    message: "&6&l🔔 JACKPOT &8» &7¡El pozo de la ruleta ya va en &6&l{amount}&7 fichas!"
holo_height: 2.3
holo_lines:
  - "&6&lRULETA"
  - "&7Haz click con tokens para apostar"
  - "&eEsperando jugadores..."

# Ítem que abre la ruleta (/gdx item roulette)
item:
  glow: true
  name: "&c&lRuleta"
  lore:
    - "&8────────────────────────"
    - "&7Click derecho para abrir"
    - "&7la &cRuleta&7."
    - "&8────────────────────────"
