# ======================
# GamblingDex - Baccarat (Punto Banco)
# ======================
# Montaje (admin), igual que el blackjack:
#   1) Mira el bloque de la mesa: /gdx station set baccarat [nombre]
#      Aparece el dealer detrás de la mesa, mirando hacia ti.
#   2) Párate en cada asiento y usa: /gdx baccarat asiento agregar <mesa>
#      (también: quitar | lista | limpiar)
#   Quitar la mesa: /gdx station remove (mirando el bloque de la mesa)
# Jugadores: se paran en un asiento y el menú de apuestas se abre solo.
#   Jugador paga 1 a 1 · Banca paga 0.95 a 1 · Empate paga 8 a 1
#   Pareja Jugador / Pareja Banca pagan 11 a 1 (si las 2 primeras cartas son iguales)
#   Si hay empate, las apuestas a Jugador y Banca se devuelven.
# Reglas estándar de tercera carta. Las cartas salen en el holograma y sobre la barra de XP.

enabled: true

min_players: 1
max_seats: 7
min_bet: 10
max_bet: 0                 # 0 = sin tope
bet_window_seconds: 20
result_seconds: 6
card_delay_ticks: 20       # pausa entre cada carta (20 = 1 segundo)
decks: 8
reshuffle_at_percent: 25

banker_payout: 0.95        # Banca paga 0.95 a 1 (5% de comisión)
tie_payout: 8              # Empate paga 8 a 1
pair_payout: 11            # Parejas pagan 11 a 1
holo_height: 1.4

# Título de cada mesa (holograma y nombre del dealer). Cada mesa que creas aparece
# aquí sola; cambia el texto de la derecha (acepta &colores, &#RRGGBB y símbolos).
default_title: "&6&l♦ BACCARAT ♦"
table_names:
  # baccarat1: "&#FFD700&l♛ BACCARAT VIP ♛"

messages:
  use_table: "&7Para jugar baccarat, &fpárate en un asiento&7 de la mesa."
  sat: "&aTe sentaste en la mesa de baccarat &f{table}&a."
  wait_round: "&7Hay una mano en curso. Apuesta en la siguiente."
  dealing: "&6&lBaccarat &8» &7Apuestas cerradas. ¡Se reparten las cartas!"
  shuffle: "&7El dealer baraja el zapato..."
  result: "&6&lBaccarat &8» {result} &8| &9Jugador {player} &8- &cBanca {banker}"
  win_player: "&9&lGANA JUGADOR"
  win_banker: "&c&lGANA BANCA"
  win_tie: "&a&lEMPATE"
  you_won: "&a&l¡Ganaste! &7Apostaste &e{bet} &7y cobras &e{paid} &a(+{net})"
  you_push: "&eEmpate para ti: &7recuperas &e{paid}&7."
  you_lost: "&cPerdiste &e{amount}&c."
  summary: "&6&lBaccarat &8» &7Ganadores: {players}"
  bet_placed: "&aApuesta a &f{spot}&a: &e+{amount} &7(total: &e{total}&7)"
  repeated: "&aRepetiste tu apuesta: &e{amount}"
  cleared: "&7Retiraste tus apuestas: &e{amount}"
  no_last_bet: "&7No tienes una apuesta anterior para repetir."
  bets_closed: "&cApuestas cerradas. Espera la siguiente mano."
  not_seated: "&cTienes que estar sentado en la mesa."
  not_enough: "&cNo te alcanzan las fichas. Tienes &e{balance}&c."
  bad_amount: "&cLa apuesta debe estar entre &e{min}&c y &e{max}&c."
  left_refund: "&7Te levantaste: se te devolvieron &e{amount}&7."
  refunded: "&7La mano de baccarat se canceló. Se te devolvieron &e{amount}&7."
  created: "&aMesa de baccarat &f{table}&a creada. Agrega asientos con &f/gdx baccarat asiento agregar {table}&a (parado en cada asiento)."
  removed: "&aMesa de baccarat eliminada (se devolvieron las apuestas)."
  exists: "&cEse bloque ya es una mesa de baccarat."
  name_taken: "&cYa existe una mesa con ese nombre."
  not_found: "&cNo existe esa mesa. Mesas: &f{tables}"
  seat_usage: "&cUso: /gdx baccarat asiento <agregar|quitar|lista|limpiar> <mesa> &7(parado en el asiento)"
  seat_added: "&aAsiento &f#{n}&a agregado a &f{table}&a."
