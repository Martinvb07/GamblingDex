# ======================
# GamblingDex - Config principal
# ======================
#
# Recarga en caliente: /gdx reload
# Colores: usa & (ej: &a, &e, &6)
#
# Importante:
# - Este archivo tiene solo lo GENERAL: fichas, cambio (Vault) y estaciones.
# - Cada juego tiene su propio archivo en plugins/GamblingDex/modules/:
#     blackjack.yml, poker.yml, ruleta.yml, slots.yml, crash.yml, carrera.yml,
#     rueda.yml, coinflip.yml, rasca.yml, bingo.yml, loteria.yml
#   (Si venías de una versión vieja, tus valores de blackjack/póker/ruleta/slots
#    se copiaron solos a esos archivos; esas secciones de este archivo ya no se usan.)
# - Los MENSAJES están en plugins/GamblingDex/messages/ (ver sección "MENSAJES" abajo)
#

# ======================
# PERMISOS (INFO)
# ======================
# Permisos principales:
#   - gamblingdex.use
#       Permite usar el plugin (abrir GUIs, /gdx balance, /gdx stats, /gdx top, etc.)
#   - gamblingdex.stats.self
#       Permite ver tus estadísticas: /gdx stats
#   - gamblingdex.stats.others
#       Permite ver estadísticas de otros: /gdx stats <jugador>
#   - gamblingdex.top
#       Permite ver el ranking: /gdx top
#   - gamblingdex.admin
#       Admin del plugin (reload, crear tokens/items, registrar mesas, crear/borrar ruletas, etc.)
#
# Defaults (plugin.yml):
#   - gamblingdex.top: público (cualquiera)
#   - gamblingdex.stats.self: público (cualquiera)
#   - gamblingdex.stats.others: solo OP/admin por defecto
#
# Tips LuckPerms (ejemplos):
#   - Dar acceso a todos:
#       /lp group default permission set gamblingdex.use true
#       /lp group default permission set gamblingdex.stats.self true
#       /lp group default permission set gamblingdex.top true
#   - Permitir ver stats de otros (solo staff, por ejemplo):
#       /lp group admin permission set gamblingdex.stats.others true
#       /lp group mod permission set gamblingdex.stats.others true
#   - Quitar permiso (si lo diste por error):
#       /lp group mod permission unset gamblingdex.stats.others
#   - Dar/quitar a un jugador puntual:
#       /lp user <name> permission set gamblingdex.stats.others true
#       /lp user <name> permission unset gamblingdex.stats.others
#   - Dar admin a tu staff:
#       /lp group admin permission set gamblingdex.admin true
#   - Dar admin a un jugador puntual:
#       /lp user <name> permission set gamblingdex.admin true
#
# Nota: algunos ítems/funciones pueden pedir un permiso extra configurable.
# Ej: exchange.rates_item_permission controla quién ve el ítem "Tasas".

# ======================
# MENSAJES
# ======================
# Todos los mensajes están organizados por archivos en:
#   plugins/GamblingDex/messages/*.yml
#
# Edita esos archivos y luego usa:
#   /gdx reload
#
# Archivos principales:
#   - messages/gdx.yml (help/stats/top/balance, etc.)
#   - messages/admin.yml
#   - messages/roulette_world.yml
#   - messages/exchange.yml
#   - messages/slots.yml
#   - messages/stations.yml
#   - messages/items.yml
#   - messages/menus.yml
#   - messages/join.yml

# ======================
# ESTADÍSTICAS / RANKING
# ======================
# Se cuentan TODOS los juegos (menos el póker, que es entre jugadores).
# /gdx top [week]  y placeholders %gamblingdex_...% (PlaceholderAPI) para hologramas.
# El ranking semanal se reinicia el lunes a las 00:00 en esta zona horaria.
stats:
  timezone: "America/Bogota"

# ======================
# MONEDA / TOKENS
# ======================

currency:
  # Símbolo/moneda mostrada en textos del plugin
  name: "⛃"
  token:
    redeem:
      # Canjear tokens con click derecho al aire (desactivado por defecto)
      enabled: false
    glow: true
    # Si activas el template, usa placeholders: {value}/{valor} y {currency}
    use_template_format: true
    display-name: "&7« &e&lFicha &6{valor} &e{currency} &7»"
    lore:
      - "&8────────────────────────"
      - "&7Valor: &6{valor} {currency}"
      - "&7Usa estas fichas en &e/warp Casino"
      - "&8────────────────────────"
    # custom-model-data: 0

# ======================
# EXCHANGE (Vault)
# ======================

exchange:
  use_vault: true # true = usa Vault/Essentials para dinero
  debug: false # true = logs detallados de compra/venta (provider + before/after)
  money_per_unit: 1.0 # Cuánto vale 1 ficha (unidad) en dinero
  buy:
    # Sin uso: comprar fichas SIEMPRE requiere Vault (sin Vault no se puede verificar el saldo).
    command: "eco take {player} {money}"
  sell:
    command: "eco give {player} {money}" # Fallback si use_vault=false
  # Cajero de fichas en 3D con ModelEngine (opcional), igual que la máquina de slots:
  # aparece en cada estación de cambio, se puede clickear y anima la compra (caen fichas)
  # y la venta (entra un billete). Las animaciones y sonidos los ven todos los que estén cerca.
  # Girarlo: mira la estación y usa /gdx station rotate.
  model:
    enabled: true
    id: exchange_machine        # nombre del modelo en ModelEngine
    hide_station: auto          # auto | always | never (esconder el telar y el holograma a quien ve el modelo)
    y_offset_hidden: 0.0        # altura de la máquina con el telar escondido (en el suelo)
    y_offset: 1.0               # con hide_station: never, la máquina va encima del telar
    holo_extra_height: 2.1      # con hide_station: never, cuánto sube el holograma
    hitbox_width: 1.0
    hitbox_height: 2.0
    sound_radius: 12

# ======================
# STATIONS (HOLOGRAMAS)
# ======================

stations:
  holo_height: 1.2 # Altura del holograma (TextDisplay), igual que Crash
  holograms:
    slots: "&d&lSLOTS"
    exchange: "&e&lCAMBIO"

# ======================
# GUI
# ======================

gui:
  exchange:
    # Menú de cambio: pestañas Comprar/Vender, fichas, cantidad y confirmar (todo en uno).
    title: "&8&l✦ &e&lCAMBIO &8&l✦"

# ======================
# CARTELES DEL CASINO
# ======================
# Carteles que se actualizan solos (no necesitan PlaceholderAPI ni otro plugin).
# Mira un cartel y usa: /gdx sign add <tipo> ...   (todos los tipos: /gdx help signs)
#   last_win [1-10]               -> último ganador (1 = el más reciente)
#   record                        -> el premio más grande de la historia
#   jackpot_slots / jackpot_roulette -> pozo de cada jackpot
#   top [1-10] [juego]            -> top de ganancias (de siempre); juego opcional (blackjack, slots...)
#   top_week [1-10] [juego]       -> top de ganancias de la semana
#   top_biggest [1-10] [juego]    -> top de mayor premio de una sola vez
#   top_wagered [1-10] [juego]    -> top de los que más apuestan
#   top_poker [1-10]              -> top de ganancias del póker
#   top_poker_pot [1-10]          -> top de botes más grandes del póker
#   schedule                      -> horario: ABIERTO / CERRADO (usa schedule_open, schedule_closed, schedule_always)
#   players_now                   -> cuántos están jugando ahora (últimos 5 min)
#   game_status <juego>           -> abierto / mantenimiento / cerrado por horario
#   table <mesa> [2]              -> info de una mesa de blackjack o póker (2 = póker: compra, bote y calle)
#   poker_board <mesa>            -> cartas de la mesa del póker (flop/turn/river) y bote; sin mano, la última
#   poker_winner <mesa>           -> quién ganó la última mano del póker, sus cartas, las de la mesa y la jugada
#   baccarat_road [mesa]          -> historial del baccarat: B banca, J jugador, E empate (sin mesa = la más cercana)
#   roulette_last                 -> últimos números de la ruleta más cercana al cartel
#   crash_last                    -> dónde explotaron las últimas rondas de Crash
#   lottery / bingo               -> bote, precio y próximo sorteo / partida
#   exchange                      -> precio de las fichas en dinero
# Quitar: /gdx sign remove (mirando el cartel) o romperlo siendo admin. Lista: /gdx sign list
# Cada cartel tiene 4 líneas de ~15 letras. Las horas salen en formato 12 h (6:00 PM).
signs:
  update_seconds: 10
  glowing: true                 # texto brillante (se lee de noche y en madera oscura)
  formats:
    last_win: ["&6&lGANADOR #{n}", "{name}", "&2+{amount}", "&8{game}"]
    record: ["&6&l★ RÉCORD ★", "{name}", "&2+{amount}", "&8{game}"]
    jackpot_slots: ["&5&lJACKPOT", "&5SLOTS", "&6&l{amount}", "&8¡Llévatelo!"]
    jackpot_roulette: ["&4&lJACKPOT", "&4RULETA", "&6&l{amount}", "&8¡Llévatelo!"]
    top: ["&1&lTOP #{n}", "{name}", "&2{amount}", "&8{game}"]
    top_week: ["&1&lTOP SEMANA #{n}", "{name}", "&2{amount}", "&8{game}"]
    top_biggest: ["&6&lMAYOR PREMIO", "&8#{n} &0{name}", "&2+{amount}", "&8{game}"]
    top_wagered: ["&1&lMÁS APOSTADO", "&8#{n} &0{name}", "&2{amount}", "&8{game}"]
    top_poker: ["&5&lTOP PÓKER #{n}", "{name}", "&2{amount}", "&8ganancias"]
    top_poker_pot: ["&5&lBOTE MAYOR #{n}", "{name}", "&2{amount}", "&8póker"]
    schedule_open: ["&6&l✦ CASINO ✦", "&2&lABIERTO", "Cierra {close}", "&8{zone}"]
    schedule_closed: ["&6&l✦ CASINO ✦", "&4&lCERRADO", "Abre {open}", "&8{zone}"]
    schedule_always: ["&6&l✦ CASINO ✦", "&2&lABIERTO", "Todo el día", ""]
    players_now: ["&6&l✦ CASINO ✦", "&8Jugando ahora", "&2&l{count}", "&8jugadores"]
    game_open: ["&l{game}", "&2&lABIERTO", "", "&8¡A jugar!"]
    game_maintenance: ["&l{game}", "&4&lMANTENIMIENTO", "", "&8Vuelve pronto"]
    game_closed_hours: ["&l{game}", "&4&lCERRADO", "Abre {open}", ""]
    table_blackjack: ["&l{name}", "Jugadores {players}/{seats}", "&2{limits}", "&8{state}"]
    table_poker: ["&l{name}", "Jugadores {players}/{seats}", "&2Ciegas {blinds}", "&8{state}"]
    table_poker_extra: ["&l{name}", "Compra &2{buyin}", "Bote: &2{pot}", "&8{street}"]
    table_closed: ["&l{name}", "&4&lCERRADA", "&8Mantenimiento", ""]
    poker_board: ["&l{name}", "&5&l{street}", "{cards}", "Bote: &2{pot}"]
    poker_board_last: ["&l{name}", "&8Última mano", "{cards}", "&8{winner}"]
    poker_winner: ["&6&lÚLTIMA MANO", "{winner} &8· {cards}", "{board}", "&8{hand}"]   # también hay {amount}
    baccarat_road: ["&6&lBACCARAT", "{row1}", "{row2}", "&4B{banker} &1J{player} &2E{tie}"]
    roulette_last: ["&4&lRULETA", "&8Últimos números", "{r1} {r2} {r3} {r4} {r5}", "{r6} {r7} {r8} {r9} {r10}"]
    crash_last: ["&4&lCRASH ↑", "{c1}  {c2}", "{c3}  {c4}", "{c5}  {c6}"]
    lottery: ["&6&lLOTERÍA", "Bote: &2{pot}", "&8Sorteo en", "{next}"]
    bingo: ["&5&lBINGO", "{next}", "Cartón: &2{price}", "Bote: &2{pot}"]
    exchange: ["&e&lCAMBIO", "1 ficha = &2${price}", "1.000 = &2${price1000}", "&8compra y venta"]

# ======================
# Resource pack del casino (fondo propio en los menús y sonidos nuevos)
# ======================
# 1) /gdx pack  -> crea plugins/GamblingDex/GamblingDex-pack.zip (y GamblingDex-merged.zip
#    con los modelos 3D de ModelEngine si lo tienes; usa /meg reload antes).
# 2) Sube el zip a una web (p. ej. mc-packs.net) y pon aquí la URL y el SHA-1 que da /gdx pack.
# 3) Activa custom_gui / custom_sounds. Quien NO tenga el pack vería cuadros en el título
#    del menú, por eso conviene send.required: true (o déjalos en false y todo sigue como siempre).
resource_pack:
  custom_gui: false        # menú de slots con fondo dibujado (máquina roja y dorada)
  custom_sounds: false     # sonidos propios de los slots (palanca, rodillos, premio, jackpot)
  custom_chips: false      # fichas en 3D (en la mano, el inventario, el suelo y los marcos).
                           # Las que ya tengan los jugadores se actualizan al entrar al server.
  custom_cards: false      # póker: cartas, fichas y botón del dealer en 3D sobre la mesa
  modelengine_pack: ""     # ruta al pack de ModelEngine si no está en plugins/ModelEngine/resource pack
  send:
    enabled: false         # mandar el pack a cada jugador al entrar
    url: ""                # enlace DIRECTO al .zip
    sha1: ""               # el SHA-1 que muestra /gdx pack (si cambias el zip, cámbialo)
    required: false        # true = quien lo rechace no puede entrar
    prompt: "&6GamblingDex &7usa un resource pack para los menús y sonidos del casino."
