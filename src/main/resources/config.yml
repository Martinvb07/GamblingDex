# ======================
# GamblingDex - Config principal
# ======================
#
# Recarga en caliente: /gdx reload
# Colores: usa & (ej: &a, &e, &6)
#
# Importante:
# - Este archivo tiene solo lo GENERAL: fichas, cambio (Vault) y estaciones.
# - Cada juego tiene su propio archivo en plugins/GamblingDex/modules/:
#     blackjack.yml, poker.yml, ruleta.yml, slots.yml, crash.yml, carrera.yml,
#     rueda.yml, coinflip.yml, rasca.yml, bingo.yml, loteria.yml
#   (Si venías de una versión vieja, tus valores de blackjack/póker/ruleta/slots
#    se copiaron solos a esos archivos; esas secciones de este archivo ya no se usan.)
# - Los MENSAJES están en plugins/GamblingDex/messages/ (ver sección "MENSAJES" abajo)
#

# ======================
# PERMISOS (INFO)
# ======================
# Permisos principales:
#   - gamblingdex.use
#       Permite usar el plugin (abrir GUIs, /gdx balance, /gdx stats, /gdx top, etc.)
#   - gamblingdex.stats.self
#       Permite ver tus estadísticas: /gdx stats
#   - gamblingdex.stats.others
#       Permite ver estadísticas de otros: /gdx stats <jugador>
#   - gamblingdex.top
#       Permite ver el ranking: /gdx top
#   - gamblingdex.admin
#       Admin del plugin (reload, crear tokens/items, registrar mesas, crear/borrar ruletas, etc.)
#
# Defaults (plugin.yml):
#   - gamblingdex.top: público (cualquiera)
#   - gamblingdex.stats.self: público (cualquiera)
#   - gamblingdex.stats.others: solo OP/admin por defecto
#
# Tips LuckPerms (ejemplos):
#   - Dar acceso a todos:
#       /lp group default permission set gamblingdex.use true
#       /lp group default permission set gamblingdex.stats.self true
#       /lp group default permission set gamblingdex.top true
#   - Permitir ver stats de otros (solo staff, por ejemplo):
#       /lp group admin permission set gamblingdex.stats.others true
#       /lp group mod permission set gamblingdex.stats.others true
#   - Quitar permiso (si lo diste por error):
#       /lp group mod permission unset gamblingdex.stats.others
#   - Dar/quitar a un jugador puntual:
#       /lp user <name> permission set gamblingdex.stats.others true
#       /lp user <name> permission unset gamblingdex.stats.others
#   - Dar admin a tu staff:
#       /lp group admin permission set gamblingdex.admin true
#   - Dar admin a un jugador puntual:
#       /lp user <name> permission set gamblingdex.admin true
#
# Nota: algunos ítems/funciones pueden pedir un permiso extra configurable.
# Ej: exchange.rates_item_permission controla quién ve el ítem "Tasas".

# ======================
# MENSAJES
# ======================
# Todos los mensajes están organizados por archivos en:
#   plugins/GamblingDex/messages/*.yml
#
# Edita esos archivos y luego usa:
#   /gdx reload
#
# Archivos principales:
#   - messages/gdx.yml (help/stats/top/balance, etc.)
#   - messages/admin.yml
#   - messages/roulette_world.yml
#   - messages/exchange.yml
#   - messages/slots.yml
#   - messages/stations.yml
#   - messages/items.yml
#   - messages/menus.yml
#   - messages/join.yml

# ======================
# ESTADÍSTICAS / RANKING
# ======================
# Se cuentan TODOS los juegos (menos el póker, que es entre jugadores).
# /gdx top [week]  y placeholders %gamblingdex_...% (PlaceholderAPI) para hologramas.
# El ranking semanal se reinicia el lunes a las 00:00 en esta zona horaria.
stats:
  timezone: "America/Bogota"

# ======================
# MONEDA / TOKENS
# ======================

currency:
  # Símbolo/moneda mostrada en textos del plugin
  name: "⛃"
  token:
    redeem:
      # Canjear tokens con click derecho al aire (desactivado por defecto)
      enabled: false
    glow: true
    # Si activas el template, usa placeholders: {value}/{valor} y {currency}
    use_template_format: true
    display-name: "&7« &e&lFicha &6{valor} &e{currency} &7»"
    lore:
      - "&8────────────────────────"
      - "&7Valor: &6{valor} {currency}"
      - "&7Usa estas fichas en &e/warp Casino"
      - "&8────────────────────────"
    # custom-model-data: 0

# ======================
# EXCHANGE (Vault)
# ======================

exchange:
  use_vault: true # true = usa Vault/Essentials para dinero
  debug: false # true = logs detallados de compra/venta (provider + before/after)
  money_per_unit: 1.0 # Cuánto vale 1 ficha (unidad) en dinero
  buy:
    # Sin uso: comprar fichas SIEMPRE requiere Vault (sin Vault no se puede verificar el saldo).
    command: "eco take {player} {money}"
  sell:
    command: "eco give {player} {money}" # Fallback si use_vault=false

# ======================
# STATIONS (HOLOGRAMAS)
# ======================

stations:
  holo_height: 1.2 # Altura del holograma (TextDisplay), igual que Crash
  holograms:
    slots: "&d&lSLOTS"
    exchange: "&e&lCAMBIO"

# ======================
# GUI
# ======================

gui:
  exchange:
    title: "&e&lCAMBIO"
    # Tamaño del inventario (múltiplos de 9). Default: 27
    size: 27
    filler:
      material: GRAY_STAINED_GLASS_PANE
      name: " "

    buttons:
      buy:
        slot: 10
        material: EMERALD
        name: "&aComprar fichas"
        lore:
          - "&7Click para comprar"
          - "&7con dinero del server"
      sell_hand:
        slot: 12
        material: GOLD_INGOT
        name: "&eVender ficha (mano)"
        lore:
          - "&7Vende 1 token en la mano"
          - "&7Shift: vende el stack"
      sell_all:
        slot: 14
        material: CHEST
        name: "&6Vender todo (inventario)"
        lore:
          - "&7Convierte todos tus tokens"
          - "&7en dinero del server"

    info_head:
      enabled: true
      slot: 16
      name: "&e&lTu info"
      # Placeholders: {money_line}, {wager}, {won}, {lost}, {currency}
      lore:
        - "{money_line}"
        - "&8(Slots + Ruleta)"
        - "&7Total apostado: &e{wager} &7{currency}"
        - "&7Total ganado: &a{won} &7{currency}"
        - "&7Total perdido: &c{lost} &7{currency}"
      # Placeholders: {money}
      money_line: "&7Dinero: &a{money}"
      money_na: "&7Dinero: &cN/A"
