name: Build jar

# Cada push a main publica una versión nueva subiendo el último número:
# v1.0.1, v1.0.2, ... Para saltar a otra versión (ej. 1.1.0 o 2.0.0),
# ejecuta el workflow a mano desde Actions y escribe la versión.

on:
  push:
    branches: [main]
    # Cambios solo de documentación no publican versión nueva.
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. 1.1.0). Vacío = subir el último número.'
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular versión
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$LAST" ]; then
              VERSION="1.0.1"
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versión inválida: $VERSION" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "La versión v$VERSION ya existe" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Poner versión en plugin.yml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version:.*/version: $VERSION/" src/main/resources/plugin.yml
          grep '^version:' src/main/resources/plugin.yml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - run: mvn -B package

      - name: Renombrar jar
        run: mv target/GamblingDex.jar "target/GamblingDex-${{ steps.version.outputs.version }}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: GamblingDex-${{ steps.version.outputs.version }}
          path: target/GamblingDex-${{ steps.version.outputs.version }}.jar

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "target/GamblingDex-$VERSION.jar" \
            --target "$GITHUB_SHA" \
            --title "GamblingDex $VERSION" \
            --generate-notes
