name: Build jar

on:
  push:
    branches: [main, claude/kind-carson-uw3c3r]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: GamblingDex
          path: target/GamblingDex.jar
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" target/GamblingDex.jar \
            --target "$GITHUB_SHA" \
            --title "GamblingDex ${TAG}" \
            --notes "Compilado automáticamente desde ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
